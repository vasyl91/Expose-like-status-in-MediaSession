name: Build and Release Patches

on:
  push:
    tags:
      - "v1.*"

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "Version: $VERSION"

          if [[ ! "$VERSION" =~ ^1\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Android patches
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndroid

      - name: Find RVP
        id: rvp
        shell: bash
        run: |
          RVP=$(find . -type f -name "*.rvp" -not -path "./.git/*" | head -n 1)

          if [ -z "$RVP" ]; then
            echo "::error::No .rvp file found"
            exit 1
          fi

          echo "Found RVP: $RVP"
          ls -lh "$RVP"

          echo "path=$RVP" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$RVP")" >> "$GITHUB_OUTPUT"

      - name: Generate patches-bundle.json
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RVP_NAME: ${{ steps.rvp.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DOWNLOAD_URL="https://github.com/${REPOSITORY}/releases/download/v${VERSION}/${RVP_NAME}"

          CREATED_AT=$(date -u +%Y-%m-%dT%H:%M:%S)

          jq -n \
            --arg created_at "$CREATED_AT" \
            --arg description "Expose-like-status-in-MediaSession v${VERSION}" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg version "$VERSION" \
            '{
              created_at: $created_at,
              description: $description,
              download_url: $download_url,
              signature_download_url: "",
              version: $version
            }' > patches-bundle.json

          echo "Generated:"
          cat patches-bundle.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Patches ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.rvp.outputs.path }}
            patches-bundle.json

      - name: Commit patches-bundle.json to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          CONTENT=$(base64 -w 0 patches-bundle.json)

          SHA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/patches-bundle.json?ref=main" \
            --jq '.sha' 2>/dev/null || true)

          ARGS=(
            --method PUT
            "repos/${GITHUB_REPOSITORY}/contents/patches-bundle.json"
            -f "message=Update patches-bundle.json for v${VERSION}"
            -f "content=${CONTENT}"
            -f "branch=main"
          )

          if [ -n "$SHA" ]; then
            echo "Updating existing patches-bundle.json"
            ARGS+=(-f "sha=${SHA}")
          else
            echo "Creating patches-bundle.json"
          fi

          gh api "${ARGS[@]}"

      - name: Summary
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "### Bundle URL for ReVanced Manager"
            echo ""
            echo '```'
            echo "https://raw.githubusercontent.com/${REPOSITORY}/main/patches-bundle.json"
            echo '```'
            echo ""
            echo "Alternatively (asset release):"
            echo ""
            echo '```'
            echo "https://github.com/${REPOSITORY}/releases/latest/download/patches-bundle.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"